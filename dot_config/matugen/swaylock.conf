# Swaylock config
# Generated with Matugen

image=~/.wallpaper_locked

# Indicator geometry
indicator-radius=80
indicator-thickness=15
line-uses-ring
separator-color=00000000

# Inside colors
inside-color={{colors.surface.default.hex}}b3
inside-clear-color={{colors.secondary_container.default.hex}}b3
inside-caps-lock-color={{colors.tertiary_container.default.hex}}b3
inside-ver-color={{colors.primary_container.default.hex}}b3
inside-wrong-color={{colors.error_container.default.hex}}b3

# Ring colors
ring-color={{colors.primary_container.default.hex}}
ring-clear-color={{colors.primary_fixed_dim.default.hex}}
ring-caps-lock-color={{colors.tertiary.default.hex}}
ring-ver-color={{colors.primary.default.hex}}
ring-wrong-color={{colors.error.default.hex}}

# Highlight colors
key-hl-color={{colors.primary.default.hex}}
bs-hl-color={{colors.error.default.hex}}

# Text colors
text-color={{colors.on_surface.default.hex}}
text-clear-color={{colors.on_secondary_container.default.hex}}
text-caps-lock-color={{colors.on_tertiary_container.default.hex}}
text-ver-color={{colors.on_primary_container.default.hex}}
text-wrong-color={{colors.on_error_container.default.hex}}
